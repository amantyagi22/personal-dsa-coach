[project]
name = "personal-dsa-coach"
version = "0.1.0"
description = "A local-first CLI coach that recommends one LeetCode problem a day, with reasons."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.18",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Markdown here is prose, not generated docs. The formatter reflows fenced code
# blocks inside it, which rewrites the brief and the spec.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
